[versions]
agp = "9.5.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
activityCompose = "1.10.1"
composeBom = "2026.09.00"
junit = "4.13.2"
ksp = "2.3.13"
room = "2.8.5"
lifecycle = "2.9.4"
