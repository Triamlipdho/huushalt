name: Release

# Builds a signed APK and publishes it as a GitHub release. Obtainium picks up the new
# release and offers the update on the phone. Two ways to start it:
# - push a tag like v1.2.3, or
# - run it from the Actions tab on main with a version like 1.2.3; the tag is then
#   created on the current commit of main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, e.g. 1.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Manual releases can only be started on main."
              exit 1
            fi
            TAG="v$INPUT_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists. Choose a higher version."
              exit 1
            fi
          else
            TAG="$REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 (minor and patch 0-99)."
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          name="${TAG#v}"
          code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $name, versionCode $code"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HUUSHALT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HUUSHALT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HUUSHALT_KEY_ALIAS }}
        run: |
          # HUUSHALT_KEY_PASSWORD is optional: it defaults to the keystore password.
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret HUUSHALT_$name is missing. See README, section Releases."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/huushalt-release.jks"
          echo "HUUSHALT_KEYSTORE_FILE=$RUNNER_TEMP/huushalt-release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Release builds always start clean.
          cache-read-only: true

      - name: Build signed release APK
        env:
          HUUSHALT_VERSION_NAME: ${{ steps.version.outputs.name }}
          HUUSHALT_VERSION_CODE: ${{ steps.version.outputs.code }}
          HUUSHALT_KEYSTORE_PASSWORD: ${{ secrets.HUUSHALT_KEYSTORE_PASSWORD }}
          HUUSHALT_KEY_ALIAS: ${{ secrets.HUUSHALT_KEY_ALIAS }}
          HUUSHALT_KEY_PASSWORD: ${{ secrets.HUUSHALT_KEY_PASSWORD }}
        # Same unit tests as CI (debug variant: the migration tests need the Room schemas, which
        # are only packaged into debug builds), then the signed release APK.
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify signature
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Signed APK not found. Is the signing configuration complete?"
            ls -R app/build/outputs/apk/release || true
            exit 1
          fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk"
          out="huushalt-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Creates the tag on the commit this run built.
            tag_args=(--target "$GITHUB_SHA")
          else
            tag_args=(--verify-tag)
          fi
          gh release create "$TAG" "$APK" \
            --title "huushalt $VERSION" \
            --generate-notes \
            "${tag_args[@]}"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/huushalt-release.jks"
