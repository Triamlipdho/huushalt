name: Feature request
description: Suggest an idea for huushalt
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        huushalt deliberately stays small: chores for one person, offline, no accounts.
        Please check the guiding principles and the "not planned" list in docs/MVP.md first.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
