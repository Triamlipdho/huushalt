name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Please don't report it here, see SECURITY.md.
        Issues may be written in English or German.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
  - type: input
    id: app-version
    attributes:
      label: huushalt version
      description: Shown in Obtainium or under Android settings → Apps → huushalt.
      placeholder: e.g. 1.3.1
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and phone
      placeholder: e.g. Android 15, Pixel 8
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Please remove personal information from screenshots and files.
